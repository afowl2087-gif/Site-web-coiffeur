<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Golden Salon</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/login.css">
</head>

<body>

<!-- TOP BAR -->
<div class="container top-bar d-flex justify-content-between align-items-center">
  <img src="./assets/img/logo.png" width="80">

  <div>
    <button class="btn btn-custom me-2">PRENDRE RDV</button>
    <button class="btn btn-custom me-2">CONTACT</button>
    <button class="btn btn-outline-dark rounded-circle">
      <i class="bi bi-arrow-left"></i>
    </button>
  </div>
</div>

<!-- LOGIN CARD -->
<div class="login-card">

  <h2 class="login-title">CONTACT US</h2>

  <form>
    <div class="input-group">
      <input type="text" class="form-control" placeholder="ur message !">
    </div>


    <button class="btn login-btn">SEND</button>
  </form>

</div>

</body>
</html>
